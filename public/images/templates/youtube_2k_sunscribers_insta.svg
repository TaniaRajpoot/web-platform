<svg viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1080" height="1350" fill="#FFFFFF"/>
  
  <!-- Red vertical line on left -->
  <rect x="0" y="0" width="12" height="1350" fill="#FF0000"/>
  
  <!-- Decorative circles -->
  <circle cx="150" cy="380" r="80" fill="none" stroke="#FFB3B3" stroke-width="2.5"/>
  <circle cx="930" cy="1000" r="100" fill="#FFE5E5"/>
  
  <!-- Header -->
  <text x="540" y="200" font-family="Arial, sans-serif" font-size="32" fill="#1a1a1a" font-weight="500" letter-spacing="4" text-anchor="middle">DEV WEEKENDS</text>
  
  <!-- Red badge -->
  <rect x="365" y="260" width="350" height="60" rx="4" fill="#FF0000"/>
  <text x="540" y="300" font-family="Arial, sans-serif" font-size="28" fill="#FFF" font-weight="600" text-anchor="middle" letter-spacing="2">YOUTUBE MILESTONE</text>
  
  <!-- Big number -->
  <text x="540" y="580" font-family="Arial, sans-serif" font-size="220" fill="#1a1a1a" font-weight="bold" text-anchor="middle">2,000</text>
  
  <!-- Red underline -->
  <rect x="290" y="600" width="500" height="8" fill="#FF0000"/>
  
  <!-- YouTube Subscribers text -->
  <text x="540" y="710" font-family="Arial, sans-serif" font-size="58" fill="#FF0000" font-weight="bold" text-anchor="middle">YouTube Subscribers</text>
  
  <!-- YouTube Play Button icon -->
  <rect x="490" y="770" width="100" height="100" rx="8" fill="#FF0000"/>
  <!-- Play triangle -->
  <polygon points="520,795 520,845 570,820" fill="#FFF"/>
  
  <!-- Subtitle -->
  <text x="540" y="960" font-family="Arial, sans-serif" font-size="32" fill="#1a1a1a" font-weight="600" text-anchor="middle">2K developers learning with us!</text>
  
  <!-- Description -->
  <text x="540" y="1020" font-family="Arial, sans-serif" font-size="24" fill="#666" text-anchor="middle">Weekly tutorials on DSA, Web Dev and Career Growth</text>
  
  <!-- Subscribe button -->
  <rect x="390" y="1080" width="300" height="70" rx="6" fill="#1a1a1a"/>
  <text x="540" y="1123" font-family="Arial, sans-serif" font-size="28" fill="#FFF" font-weight="600" text-anchor="middle">SUBSCRIBE NOW</text>
  
  
  
</svg>