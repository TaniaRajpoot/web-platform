  <text x="175" y="650" font-family="Arial, sans-serif" font-size="31" font-weight="bold" fill="#000">Hashmaps</text>
  <text x="175" y="682" font-family="Arial, sans-serif" font-size="21" fill="#666">Monday, 9:00 PM - Speakers: Ahad Ali, M. Ali Khan</text>
  
  <!-- Hashmaps - Day 3 (Wednesday) -->
  <rect x="90" y="720" width="900" height="95" rx="8" fill="#FFF" stroke="#DDD" stroke-width="1.5"/>
  <circle cx="135" cy="758" r="11" fill="#4CAF50"/>
  <text x="175" y="760" font-family="Arial, sans-serif" font-size="31" font-weight="bold" fill="#000">Hashmaps</text>
