  <text x="290" y="1117" font-family="Arial, sans-serif" font-size="30" font-weight="600" fill="#FFF" text-anchor="middle">Join Dev Weekends</text>
  
  <text x="900" y="1117" font-family="Arial, sans-serif" font-size="28" fill="#000" text-anchor="end">@devweekends</text>
