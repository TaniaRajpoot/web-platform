<svg viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1080" height="1350" fill="#F5F5F5"/>
  
  <!-- Header Section -->
  <text x="90" y="140" font-family="Arial, sans-serif" font-size="30" fill="#888" font-weight="500" letter-spacing="2">DEV WEEKENDS</text>
  
  <text x="90" y="225" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="#000">Weekly Schedule</text>
  
